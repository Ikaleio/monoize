name: Nightly build

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nightly-master
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly-${{ github.sha }}

jobs:
  validate:
    name: Check current master commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve build inputs
        id: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          release_tag="v$version"
          python3 scripts/package_release.py validate --tag "$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Skip a superseded commit before building
        id: head
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $GITHUB_SHA because master is now $current"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux-x64:
    name: Build x86_64-unknown-linux-musl
    needs: validate
    if: needs.validate.outputs.current == 'true'
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      python: python3
      linker: x86_64-unknown-linux-musl-gcc
      static_libgcc: false
      builder_image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
      revision: ${{ github.sha }}
      tag: ${{ needs.validate.outputs.release_tag }}
      stage_npm: false

  build-linux-arm64:
    name: Build aarch64-unknown-linux-musl
    needs: validate
    if: needs.validate.outputs.current == 'true'
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      python: python3
      linker: aarch64-unknown-linux-musl-gcc
      static_libgcc: true
      builder_image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
      revision: ${{ github.sha }}
      tag: ${{ needs.validate.outputs.release_tag }}
      stage_npm: false

  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs: validate
    if: needs.validate.outputs.current == 'true'
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      python: python
      revision: ${{ github.sha }}
      tag: ${{ needs.validate.outputs.release_tag }}
      stage_npm: false

  verify:
    name: Verify available nightly assets
    if: ${{ always() && needs.validate.outputs.current == 'true' }}
    needs: [validate, build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify available asset set
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

  publish-release:
    name: Publish nightly GitHub Release
    needs: [validate, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded assets
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

      - name: Check master before uploading assets
        id: head
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping upload of $GITHUB_SHA because master is now $current"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update nightly prerelease
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$NIGHTLY_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$NIGHTLY_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightly $GITHUB_SHA" \
              --notes "Automated build from commit $GITHUB_SHA." \
              --prerelease \
              --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-container-amd64:
    name: Build container linux/amd64
    needs: [validate, build-linux-x64]
    if: ${{ always() && needs.validate.outputs.current == 'true' && needs.build-linux-x64.result == 'success' }}
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
    with:
      runner: ubuntu-24.04
      platform: linux/amd64
      artifact: amd64
      native_target: x86_64-unknown-linux-musl
      cache_scope: linux-amd64
      revision: ${{ github.sha }}
      image_name: ${{ needs.validate.outputs.image }}
      container_tag: nightly-${{ github.sha }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
      latest_branch: master

  build-container-arm64:
    name: Build container linux/arm64
    needs: [validate, build-linux-arm64]
    if: ${{ always() && needs.validate.outputs.current == 'true' && needs.build-linux-arm64.result == 'success' }}
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      platform: linux/arm64
      artifact: arm64
      native_target: aarch64-unknown-linux-musl
      cache_scope: linux-arm64
      revision: ${{ github.sha }}
      image_name: ${{ needs.validate.outputs.image }}
      container_tag: nightly-${{ github.sha }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
      latest_branch: master

  publish-container:
    name: Publish nightly container manifest
    if: ${{ always() && needs.validate.outputs.current == 'true' }}
    needs: [validate, build-container-amd64, build-container-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
    steps:
      - name: Download platform digests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Detect available platform digests
        id: digest-set
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest_count=$(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | wc -l)
          if [[ "$digest_count" -gt 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping container publication because no platform digest is available."
          fi

      - name: Log in to GHCR
        if: steps.digest-set.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.digest-set.outputs.available == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Check master before publishing image tags
        if: steps.digest-set.outputs.available == 'true'
        id: head
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping image tags for $GITHUB_SHA because master is now $current"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create and inspect nightly container manifest
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          sources=()
          while IFS= read -r digest_file; do
            sources+=("$IMAGE_NAME@sha256:$(basename "$digest_file")")
          done < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)

          docker buildx imagetools create \
            --tag "$IMAGE_NAME:nightly" \
            --tag "$IMAGE_NAME:$NIGHTLY_TAG" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$NIGHTLY_TAG"
