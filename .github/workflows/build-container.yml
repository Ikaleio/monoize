name: Build container platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      artifact:
        required: true
        type: string
      native_target:
        required: true
        type: string
      cache_scope:
        required: true
        type: string
      revision:
        required: true
        type: string
      image_name:
        required: true
        type: string
      container_tag:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  container:
    name: Build container ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      IMAGE_NAME: ${{ inputs.image_name }}
      NATIVE_TARGET: ${{ inputs.native_target }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CONTAINER_TAG: ${{ inputs.container_tag }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download native linux archive
        id: native
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.native_target }}
          path: dist

      - name: Stage prebuilt binary
        if: ${{ steps.native.outcome == 'success' }}
        shell: bash
        run: |
          archive="monoize-${RELEASE_TAG}-${NATIVE_TARGET}.tar.gz"
          cd dist
          sha256sum -c "${archive}.sha256"
          tar -xzf "$archive"
          cd ..
          mkdir -p docker-pack
          install -m 0755 "dist/monoize-${RELEASE_TAG}-${NATIVE_TARGET}/monoize" docker-pack/monoize
          cp Dockerfile docker-pack/Dockerfile

      - name: Log in to GHCR
        if: ${{ steps.native.outcome == 'success' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: ${{ steps.native.outcome == 'success' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push platform image
        if: ${{ steps.native.outcome == 'success' }}
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: docker-pack
          platforms: ${{ inputs.platform }}
          build-args: |
            VERSION=${{ env.CONTAINER_TAG }}
            REVISION=${{ steps.source.outputs.revision }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}

      - name: Stage platform digest
        if: ${{ steps.native.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.container.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload platform digest
        if: ${{ steps.native.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ inputs.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
