name: Build native target

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      python:
        required: true
        type: string
      revision:
        required: true
        type: string
      tag:
        required: true
        type: string
      linker:
        required: false
        type: string
        default: ""
      static_libgcc:
        required: false
        type: string
        default: "false"
      builder_image:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  native:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
      PYTHON: ${{ inputs.python }}
      LINKER: ${{ inputs.linker }}
      STATIC_LIBGCC: ${{ inputs.static_libgcc }}
      BUILDER_IMAGE: ${{ inputs.builder_image }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Install stable Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc -vV

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ inputs.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build non-Linux release binary
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build --locked --release --target "$TARGET"

      - name: Build static musl release binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/rust/src" \
            --volume "$HOME/.cargo/registry:/root/.cargo/registry" \
            --volume "$HOME/.cargo/git:/root/.cargo/git" \
            --volume "$(command -v bun):/usr/local/bin/bun:ro" \
            --workdir /home/rust/src \
            --env "MONOIZE_MUSL_LINKER=$LINKER" \
            --env "MONOIZE_MUSL_STATIC_LIBGCC=$STATIC_LIBGCC" \
            --env RUSTFLAGS \
            "$BUILDER_IMAGE" \
            cargo build \
              --config "target.${TARGET}.linker=\"/home/rust/src/scripts/musl-linker.sh\"" \
              --locked \
              --release \
              --target "$TARGET"
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static -C link-arg=-static-libstdc++

      - name: Restore runner ownership after Linux build
        if: ${{ runner.os == 'Linux' && always() }}
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo"
          if [[ -e "$GITHUB_WORKSPACE/target" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/target"
          fi

      - name: Verify static musl linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/$TARGET/release/monoize"
          file "$binary"
          if readelf --program-headers "$binary" | grep -q 'INTERP'; then
            echo "$binary contains an ELF interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" | grep -q '(NEEDED)'; then
            echo "$binary contains a dynamic-library dependency" >&2
            exit 1
          fi
          echo "$binary has no ELF interpreter or dynamic-library dependency"

      - name: Package release asset
        shell: bash
        run: >-
          "$PYTHON" scripts/package_release.py package
          --tag "$RELEASE_TAG"
          --target "$TARGET"
          --output-dir dist

      - name: Stage target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage npm platform package
        shell: bash
        run: |
          binary="target/$TARGET/release/monoize"
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            binary="${binary}.exe"
          fi
          bun npm/scripts/package.ts stage-platform \
            --tag "$RELEASE_TAG" \
            --target "$TARGET" \
            --binary "$binary" \
            --output-dir npm-stage
          bun npm/scripts/package.ts pack \
            --packages-dir npm-stage \
            --output-dir npm-dist

      - name: Upload npm platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ inputs.target }}
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
