name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without publishing Release assets
        required: true
        type: string
      tag:
        description: Expected v-prefixed Cargo version
        required: true
        type: string
      publish_container:
        description: Publish a GHCR image during this manual preflight
        required: true
        default: false
        type: boolean
      container_tag:
        description: Exact container tag for a manual publication
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  CONTAINER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.container_tag }}

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Match tag to Cargo version
        run: python3 scripts/package_release.py validate --tag "$RELEASE_TAG"

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate container tag
        if: ${{ github.event_name == 'release' || inputs.publish_container }}
        shell: bash
        run: |
          if [[ ! "$CONTAINER_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid container tag: $CONTAINER_TAG" >&2
            exit 1
          fi

      - name: Resolve container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc -vV
        env:
          TARGET: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: >-
          "$PYTHON" scripts/package_release.py package
          --tag "$RELEASE_TAG"
          --target "$TARGET"
          --output-dir dist
        env:
          PYTHON: ${{ matrix.python }}
          TARGET: ${{ matrix.target }}

      - name: Stage target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    name: Verify complete release set
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete asset set
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist

  publish:
    name: Attach assets to GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload Release assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-container:
    name: Build container ${{ matrix.platform }}
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.verify.result == 'success'
          && ((github.event_name == 'release' && needs.publish.result == 'success')
              || (github.event_name == 'workflow_dispatch' && inputs.publish_container)) }}
    needs: [validate, verify, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
            cache-scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
            cache-scope: linux-arm64
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push platform image
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.CONTAINER_TAG }}
            REVISION=${{ steps.source.outputs.revision }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Stage platform digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.container.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-container:
    name: Publish multi-platform container
    if: ${{ github.event_name == 'release' || inputs.publish_container }}
    needs: [validate, build-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Create and verify container manifest
        shell: bash
        run: |
          tags=("$IMAGE_NAME:$CONTAINER_TAG")
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${CONTAINER_TAG#v}"
            IFS=. read -r major minor patch <<< "$version"
            tags+=("$IMAGE_NAME:$version" "$IMAGE_NAME:$major.$minor" "$IMAGE_NAME:$major" "$IMAGE_NAME:latest")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          while IFS= read -r digest_file; do
            sources+=("$IMAGE_NAME@sha256:$(basename "$digest_file")")
          done < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)

          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "expected 2 platform digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$CONTAINER_TAG"
