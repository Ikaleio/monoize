name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without publishing Release assets
        required: true
        type: string
      tag:
        description: Expected v-prefixed Cargo version
        required: true
        type: string
      publish_container:
        description: Publish a GHCR image during this manual preflight
        required: true
        default: false
        type: boolean
      container_tag:
        description: Exact container tag for a manual publication
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  CONTAINER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.container_tag }}

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Match tag to Cargo version
        run: python3 scripts/package_release.py validate --tag "$RELEASE_TAG"

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate container tag
        if: ${{ github.event_name == 'release' || inputs.publish_container }}
        shell: bash
        run: |
          if [[ ! "$CONTAINER_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid container tag: $CONTAINER_TAG" >&2
            exit 1
          fi

      - name: Resolve container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            python: python3
            linker: x86_64-unknown-linux-musl-gcc
            static_libgcc: false
            builder_image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            python: python3
            linker: aarch64-unknown-linux-musl-gcc
            static_libgcc: true
            builder_image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Install stable Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc -vV
        env:
          TARGET: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build non-Linux release binary
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build static musl release binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/rust/src" \
            --volume "$HOME/.cargo/registry:/root/.cargo/registry" \
            --volume "$HOME/.cargo/git:/root/.cargo/git" \
            --volume "$(command -v bun):/usr/local/bin/bun:ro" \
            --workdir /home/rust/src \
            --env "MONOIZE_MUSL_LINKER=$LINKER" \
            --env "MONOIZE_MUSL_STATIC_LIBGCC=$STATIC_LIBGCC" \
            --env RUSTFLAGS \
            "$BUILDER_IMAGE" \
            cargo build \
              --config "target.${TARGET}.linker=\"/home/rust/src/scripts/musl-linker.sh\"" \
              --locked \
              --release \
              --target "$TARGET"
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          LINKER: ${{ matrix.linker }}
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static -C link-arg=-static-libstdc++
          STATIC_LIBGCC: ${{ matrix.static_libgcc }}
          TARGET: ${{ matrix.target }}

      - name: Restore runner ownership after Linux build
        if: ${{ runner.os == 'Linux' && always() }}
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo"
          if [[ -e "$GITHUB_WORKSPACE/target" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/target"
          fi

      - name: Verify static musl linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/$TARGET/release/monoize"
          file "$binary"
          if readelf --program-headers "$binary" | grep -q 'INTERP'; then
            echo "$binary contains an ELF interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" | grep -q '(NEEDED)'; then
            echo "$binary contains a dynamic-library dependency" >&2
            exit 1
          fi
          echo "$binary has no ELF interpreter or dynamic-library dependency"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: >-
          "$PYTHON" scripts/package_release.py package
          --tag "$RELEASE_TAG"
          --target "$TARGET"
          --output-dir dist
        env:
          PYTHON: ${{ matrix.python }}
          TARGET: ${{ matrix.target }}

      - name: Stage target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage npm platform package
        shell: bash
        run: |
          binary="target/$TARGET/release/monoize"
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            binary="${binary}.exe"
          fi
          bun npm/scripts/package.ts stage-platform \
            --tag "$RELEASE_TAG" \
            --target "$TARGET" \
            --binary "$binary" \
            --output-dir npm-stage
          bun npm/scripts/package.ts pack \
            --packages-dir npm-stage \
            --output-dir npm-dist
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload npm platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.target }}
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    name: Verify available release set
    if: ${{ always() && needs.validate.result == 'success' }}
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify available asset set
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist

  publish:
    name: Attach assets to GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload Release assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  package-npm:
    name: Verify available npm package set
    if: ${{ always() && needs.validate.result == 'success' && needs.verify.result == 'success' }}
    needs: [validate, build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Test TypeScript launcher
        run: bun test npm/tests

      - name: Download npm platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: npm-dist
          merge-multiple: true

      - name: Build root npm package
        shell: bash
        run: |
          bun npm/scripts/package.ts stage-root \
            --tag "$RELEASE_TAG" \
            --output-dir npm-stage
          bun npm/scripts/package.ts pack \
            --packages-dir npm-stage \
            --output-dir npm-dist

      - name: Verify available npm package set
        run: bun npm/scripts/package.ts verify --tag "$RELEASE_TAG" --directory npm-dist

      - name: Detect packaging runner platform package
        id: client-platform
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ -f "npm-dist/monoize-${version}-linux-x64.tgz" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping client installation verification because linux-x64 is unavailable."
          fi

      - name: Install pnpm for compatibility verification
        if: ${{ steps.client-platform.outputs.available == 'true' }}
        shell: bash
        run: npm install --prefix target/npm-tools --ignore-scripts --no-audit --no-fund pnpm@10.33.0
        env:
          npm_config_cache: ${{ github.workspace }}/target/npm-tool-cache

      - name: Verify Bun, npm, and pnpm installation
        if: ${{ steps.client-platform.outputs.available == 'true' }}
        shell: bash
        run: >-
          bun npm/scripts/verify-clients.ts
          --tag "$RELEASE_TAG"
          --directory npm-dist
          --pnpm target/npm-tools/node_modules/.bin/pnpm

      - name: Upload available npm package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-set
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-npm:
    name: Publish npm package set
    if: github.event_name == 'release'
    needs: [validate, package-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Download npm package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-set
          path: npm-dist

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI for Trusted Publishing
        shell: bash
        run: |
          npm install --global npm@12.0.2 --no-audit --no-fund
          test "$(npm --version)" = "12.0.2"

      - name: Publish platform packages, then root package
        shell: bash
        run: bun npm/scripts/package.ts publish --tag "$RELEASE_TAG" --directory npm-dist

  build-container:
    name: Build container ${{ matrix.platform }}
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.verify.result == 'success'
          && ((github.event_name == 'release' && needs.publish.result == 'success')
              || (github.event_name == 'workflow_dispatch' && inputs.publish_container)) }}
    needs: [validate, verify, publish]
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
            native_target: x86_64-unknown-linux-musl
            cache-scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
            native_target: aarch64-unknown-linux-musl
            cache-scope: linux-arm64
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
      NATIVE_TARGET: ${{ matrix.native_target }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download native linux archive
        id: native
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.native_target }}
          path: dist

      - name: Stage prebuilt binary
        if: ${{ steps.native.outcome == 'success' }}
        shell: bash
        run: |
          archive="monoize-${RELEASE_TAG}-${NATIVE_TARGET}.tar.gz"
          cd dist
          sha256sum -c "${archive}.sha256"
          tar -xzf "$archive"
          cd ..
          mkdir -p docker-pack
          install -m 0755 "dist/monoize-${RELEASE_TAG}-${NATIVE_TARGET}/monoize" docker-pack/monoize
          cp Dockerfile docker-pack/Dockerfile

      - name: Log in to GHCR
        if: ${{ steps.native.outcome == 'success' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: ${{ steps.native.outcome == 'success' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push platform image
        if: ${{ steps.native.outcome == 'success' }}
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: docker-pack
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.CONTAINER_TAG }}
            REVISION=${{ steps.source.outputs.revision }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Stage platform digest
        if: ${{ steps.native.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.container.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload platform digest
        if: ${{ steps.native.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-container:
    name: Publish multi-platform container
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && (github.event_name == 'release' || inputs.publish_container) }}
    needs: [validate, build-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
    steps:
      - name: Download platform digests
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Detect available platform digests
        id: digest-set
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest_count=$(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | wc -l)
          if [[ "$digest_count" -gt 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping container publication because no platform digest is available."
          fi

      - name: Log in to GHCR
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Create and verify container manifest
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        shell: bash
        run: |
          tags=("$IMAGE_NAME:$CONTAINER_TAG")
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${CONTAINER_TAG#v}"
            IFS=. read -r major minor patch <<< "$version"
            tags+=("$IMAGE_NAME:$version" "$IMAGE_NAME:$major.$minor" "$IMAGE_NAME:$major" "$IMAGE_NAME:latest")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          while IFS= read -r digest_file; do
            sources+=("$IMAGE_NAME@sha256:$(basename "$digest_file")")
          done < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)

          if [[ "${#sources[@]}" -lt 1 ]]; then
            echo "expected at least 1 platform digest, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$CONTAINER_TAG"
