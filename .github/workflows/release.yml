name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without publishing Release assets
        required: true
        type: string
      tag:
        description: Expected v-prefixed Cargo version
        required: true
        type: string
      publish_container:
        description: Publish a GHCR image during this manual preflight
        required: true
        default: false
        type: boolean
      container_tag:
        description: Exact container tag for a manual publication
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  CONTAINER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.container_tag }}

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Match tag to Cargo version
        run: python3 scripts/package_release.py validate --tag "$RELEASE_TAG"

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate container tag
        if: ${{ github.event_name == 'release' || inputs.publish_container }}
        shell: bash
        run: |
          if [[ ! "$CONTAINER_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid container tag: $CONTAINER_TAG" >&2
            exit 1
          fi

      - name: Resolve container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-linux-x64:
    name: Build x86_64-unknown-linux-musl
    needs: validate
    continue-on-error: true
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      python: python3
      linker: x86_64-unknown-linux-musl-gcc
      static_libgcc: "false"
      builder_image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
      revision: ${{ needs.validate.outputs.revision }}
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  build-linux-arm64:
    name: Build aarch64-unknown-linux-musl
    needs: validate
    continue-on-error: true
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      python: python3
      linker: aarch64-unknown-linux-musl-gcc
      static_libgcc: "true"
      builder_image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
      revision: ${{ needs.validate.outputs.revision }}
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs: validate
    continue-on-error: true
    uses: ./.github/workflows/build-native.yml
    permissions:
      contents: read
      actions: write
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      python: python
      revision: ${{ needs.validate.outputs.revision }}
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  verify:
    name: Verify available release set
    if: ${{ always() && needs.validate.result == 'success' }}
    needs: [validate, build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify available asset set
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist

  publish:
    name: Attach assets to GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload Release assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  package-npm:
    name: Verify available npm package set
    if: ${{ always() && needs.validate.result == 'success' && needs.verify.result == 'success' }}
    needs: [validate, build-linux-x64, build-linux-arm64, build-windows, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Download npm platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: npm-dist
          merge-multiple: true

      - name: Build root npm package
        shell: bash
        run: |
          bun npm/scripts/package.ts stage-root \
            --tag "$RELEASE_TAG" \
            --output-dir npm-stage
          bun npm/scripts/package.ts pack \
            --packages-dir npm-stage \
            --output-dir npm-dist

      - name: Verify available npm package set
        run: bun npm/scripts/package.ts verify --tag "$RELEASE_TAG" --directory npm-dist

      - name: Detect packaging runner platform package
        id: client-platform
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ -f "npm-dist/monoize-${version}-linux-x64.tgz" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping client installation verification because linux-x64 is unavailable."
          fi

      - name: Install pnpm for compatibility verification
        if: ${{ steps.client-platform.outputs.available == 'true' }}
        shell: bash
        run: npm install --prefix target/npm-tools --ignore-scripts --no-audit --no-fund pnpm@10.33.0
        env:
          npm_config_cache: ${{ github.workspace }}/target/npm-tool-cache

      - name: Verify Bun, npm, and pnpm installation
        if: ${{ steps.client-platform.outputs.available == 'true' }}
        shell: bash
        run: >-
          bun npm/scripts/verify-clients.ts
          --tag "$RELEASE_TAG"
          --directory npm-dist
          --pnpm target/npm-tools/node_modules/.bin/pnpm

      - name: Upload available npm package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-set
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-npm:
    name: Publish npm package set
    if: github.event_name == 'release'
    needs: [validate, package-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Download npm package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-set
          path: npm-dist

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI for Trusted Publishing
        shell: bash
        run: |
          npm install --global npm@12.0.2 --no-audit --no-fund
          test "$(npm --version)" = "12.0.2"

      - name: Publish platform packages, then root package
        shell: bash
        run: bun npm/scripts/package.ts publish --tag "$RELEASE_TAG" --directory npm-dist

  build-container-amd64:
    name: Build container linux/amd64
    needs: [validate, build-linux-x64]
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.build-linux-x64.result == 'success'
          && (github.event_name == 'release'
              || (github.event_name == 'workflow_dispatch' && inputs.publish_container)) }}
    continue-on-error: true
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
    with:
      runner: ubuntu-24.04
      platform: linux/amd64
      artifact: amd64
      native_target: x86_64-unknown-linux-musl
      cache_scope: linux-amd64
      revision: ${{ needs.validate.outputs.revision }}
      image_name: ${{ needs.validate.outputs.image }}
      container_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.container_tag }}
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  build-container-arm64:
    name: Build container linux/arm64
    needs: [validate, build-linux-arm64]
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.build-linux-arm64.result == 'success'
          && (github.event_name == 'release'
              || (github.event_name == 'workflow_dispatch' && inputs.publish_container)) }}
    continue-on-error: true
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      platform: linux/arm64
      artifact: arm64
      native_target: aarch64-unknown-linux-musl
      cache_scope: linux-arm64
      revision: ${{ needs.validate.outputs.revision }}
      image_name: ${{ needs.validate.outputs.image }}
      container_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.container_tag }}
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  publish-container:
    name: Publish multi-platform container
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && (github.event_name == 'release' || inputs.publish_container) }}
    needs: [validate, build-container-amd64, build-container-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
    steps:
      - name: Download platform digests
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Detect available platform digests
        id: digest-set
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest_count=$(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | wc -l)
          if [[ "$digest_count" -gt 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping container publication because no platform digest is available."
          fi

      - name: Log in to GHCR
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Create and verify container manifest
        if: ${{ steps.digest-set.outputs.available == 'true' }}
        shell: bash
        run: |
          tags=("$IMAGE_NAME:$CONTAINER_TAG")
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${CONTAINER_TAG#v}"
            IFS=. read -r major minor patch <<< "$version"
            tags+=("$IMAGE_NAME:$version" "$IMAGE_NAME:$major.$minor" "$IMAGE_NAME:$major" "$IMAGE_NAME:latest")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          while IFS= read -r digest_file; do
            sources+=("$IMAGE_NAME@sha256:$(basename "$digest_file")")
          done < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)

          if [[ "${#sources[@]}" -lt 1 ]]; then
            echo "expected at least 1 platform digest, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$CONTAINER_TAG"
